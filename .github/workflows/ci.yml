name: Wardline ARM64 Multi-OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  zig-engines-cross:
    name: Zig 4-OS ARM64 Engine Cross-Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Cross-compile Win/Linux/macOS/FreeBSD ARM64 engines
        run: |
          zig build all-engines
          zig build common-tests

  win-arm64-cross:
    name: Windows ARM64 Cross-Build & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,aarch64-pc-windows-gnullvm
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build Zig ARM64 engines & run common Zig tests
        shell: pwsh
        run: |
          zig build all-engines
          zig build test
      - name: Clippy Workspace (aarch64-pc-windows-msvc)
        shell: pwsh
        run: cargo clippy --target aarch64-pc-windows-msvc --workspace --all-targets -- -D warnings
      - name: Run host pure-Rust core/policy/cert tests
        shell: pwsh
        run: cargo test -p wardline-core -p wardline-policy -p wardline-cert -- -q

  win-arm64-native:
    name: Windows 11 ARM64 Native Test Suite
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Zig tests & engine build
        shell: pwsh
        run: |
          zig build all-engines
          zig build test
      - name: Cargo clippy & full live workspace tests
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1
          cargo build --release --bins

  linux-arm64-native:
    name: Linux ARM64 Native Build & Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install OpenSSL headers & build/test workspace
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          zig build linux-arm64
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1
          cargo build --release --bins

  macos-arm64-native:
    name: macOS Apple Silicon Native Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build & test workspace on Apple Silicon
        run: |
          zig build macos-arm64
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1
          cargo build --release --bins
